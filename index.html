<html lang="en">
<head>

<title>Interstellar Black Hole — Geodesic Raytracer</title>
<style>

  #hud {
    position: fixed; left: 14px; bottom: 14px;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: rgba(255,255,255,0.60); pointer-events: none; user-select: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  #hud b { color: #ffd8a0; }
  #hud .fpsrow { margin-top: 2px; opacity: 0.55; }
  #hud .fpsbtn {
    font: inherit; color: rgba(255,255,255,0.75);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.18); border-radius: 4px;
    min-width: 30px; min-height: 26px; padding: 0 6px; margin: 0 4px;
    cursor: pointer; pointer-events: auto;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    user-select: none; vertical-align: middle;
  }
  #hud .fpsbtn:hover { background: rgba(255,255,255,0.12); }
  #hud .fpsbtn:active { background: rgba(255,255,255,0.20); }
  #tune {
    position: fixed; top: 12px; right: 12px; width: 200px;
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: rgba(255,255,255,0.70);
    background: rgba(8,8,10,0.55);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 8px;
    padding: 8px 10px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    user-select: none; z-index: 5;
  }
  #tuneHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  #tuneHead b { color: #ffd8a0; letter-spacing: 0.08em; font-weight: bold; }
  #tune button {
    font: inherit; color: rgba(255,255,255,0.75);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.18); border-radius: 4px;

<body>
<canvas id="gl"></canvas>
<div id="err"></div>
<div id="hud">
  <span id="hudText"><b>drag</b> orbit · <b>scroll</b> zoom · <b>dbl-click</b> reset</span>
  <div class="fpsrow">
    <button class="fpsbtn" id="fpsDown" aria-label="Lower target fps by 5">−5</button>

<script id="vsQuad" type="x-shader/x-vertex">
attribute vec2 aPos;
varying vec2 vUv;
void main(){
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}
</script>

<script id="fsScene" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

uniform vec2  uRes;
uniform float uTime;
uniform vec3  uEye;
uniform vec3  uFwd;
uniform vec3  uRight;
uniform vec3  uUp;
uniform float uFov;     // tan(half vertical fov)
uniform float uSpin;    // +1 / -1 disk rotation sense

// --- live-tunable look knobs (driven by the on-screen TUNE panel) ---
uniform float uSpinTime;    // pattern clock for disk rotation (rate-tunable)
uniform float uDiskGain;    // disk emission exposure
uniform float uBeamPow;     // Doppler beaming exponent (0 = symmetric, 4 ≈ physical g^4)
uniform float uRadialDecay; // radial emission falloff steepness
uniform float uTexContrast; // dust texture contrast
uniform float uHazeGain;    // volumetric haze strength

const float RS     = 1.0;   // Schwarzschild radius (units of rs)
const float RIN    = 3.0;   // disk inner radius (ISCO-ish)
const float ROUT   = 9.0;   // disk outer radius (nominal; edge fades beyond this)
const float RFADE  = 2.2;   // width of the wispy, semi-transparent outer fade
const float RESC   = 45.0;  // escape radius -> sample sky
const int  MAXSTEP = 1200;

// ---------- math helpers ----------
float hash31(vec3 p){
  return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453);
}
float noise3(vec3 p){
  vec3 i = floor(p);
  vec3 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(mix(hash31(i+vec3(0,0,0)), hash31(i+vec3(1,0,0)), f.x),
        mix(hash31(i+vec3(0,1,0)), hash31(i+vec3(1,1,0)), f.x), f.y),
    mix(mix(hash31(i+vec3(0,0,1)), hash31(i+vec3(1,0,1)), f.x),
        mix(hash31(i+vec3(0,1,1)), hash31(i+vec3(1,1,1)), f.x), f.y),
    f.z);
}
float fbm(vec3 p){
  float a = 0.5, s = 0.0;
  for(int i=0;i<4;i++){ s += a * noise3(p); p *= 2.03; a *= 0.5; }
  return s;
}
// 3-octave variant for the domain-WARP fields (w1/w2): their output only
// perturbs the sample coordinates of another fbm, so the lost octave is
// invisible — and each skipped octave saves a full noise3 (8 hash evals).
float fbmW(vec3 p){
  float a = 0.5, s = 0.0;
  for(int i=0;i<3;i++){ s += a * noise3(p); p *= 2.03; a *= 0.5; }
  return s;
}

float A(float r){ return 1.0 - RS / r; }
float Ap(float r){ return RS / (r * r); }

// --- orbital-plane null geodesic integrator (no polar singularity) ---
// Every photon stays in the plane spanned by (eye, ray direction). In-plane
// state is (r, psi, dr/dλ, dψ/dλ) with conserved E² = A(r0) from the init.
// This avoids the spherical-coordinate singularity at the poles entirely.
vec2 accel2(float r, float drdl, float dpsidl, float E2){
  float aa  = A(r);
  float aap = Ap(r);
  float rdd   = -(aap * E2) / (2.0 * aa)
              + (aap / (2.0 * aa)) * drdl * drdl
              + r * aa * dpsidl * dpsidl;
  float psidd = -2.0 * (drdl / r) * dpsidl;
  return vec2(rdd, psidd);
}

// Gargantua palette: ember -> amber -> gold -> warm white. The film disk is
// a near-uniform golden glow, so the ramp deliberately never goes blue.
vec3 diskColor(float t){
  t = clamp(t, 0.0, 1.0);
  vec3 c = vec3(0.45, 0.12, 0.03);
  c = mix(c, vec3(0.95, 0.45, 0.12), smoothstep(0.0, 0.40, t));
  c = mix(c, vec3(1.00, 0.78, 0.42), smoothstep(0.40, 0.75, t));
  c = mix(c, vec3(1.00, 0.96, 0.86), smoothstep(0.75, 1.0, t));
  return c;
}

// accretion disk emission at a hit point, given photon direction khat.
// returns color + alpha (alpha fades to 0 across the wispy outer edge)
void diskEmission(vec3 hit, vec3 khat, float r, out vec3 ocol, out float oalpha){
  // Keplerian orbital speed (local static observer), relativistic-ish
  float vv = sqrt(0.5 / (r - RS));
  float mag = clamp(vv, 0.0, 0.95);

  // tangential direction (counter/clockwise by uSpin)
  vec3 dirOrb = normalize(cross(vec3(0.0, 0.0, uSpin), hit));

  float betaK = mag * dot(dirOrb, khat);
  float gamma = 1.0 / sqrt(max(1e-4, 1.0 - mag * mag));

  float gDop  = 1.0 / (gamma * (1.0 - betaK));      // Doppler factor
  float gGrav = sqrt(A(r));                          // gravitational redshift
  float g = gDop * gGrav;

  // Doppler beaming as a POWER of the total shift g: 0 = perfectly symmetric,
  // 1 = linear boost, 3-4 ≈ the physical I ∝ g^(3..4) law. Because the disk's
  // outer edge is feathered semi-transparent wisps, a strong exponent makes
  // the approaching side's wisps stay visible far beyond where the receding
  // side fades — so the VISIBLE outline of the disk becomes genuinely
  // asymmetric, not just its brightness. The upper clamp grows with the
  // setting: high values stay dramatic without flooding the frame with white.
  float beam = clamp(pow(g, uBeamPow), 0.50, 1.60 + 0.35 * uBeamPow);

  // temperature: Shakura-Sunyaev thin disk, T ∝ r^(-3/4)
  // relativistic hue shift INSIDE the amber family: Doppler-boosted plasma
  // reads hotter (toward white-hot gold), receding plasma reads cooler
  // (deeper ember/copper) — the same physics the film's color story implies,
  // expressed as temperature instead of raw brightness. Never blue.
  // hue shift widens with the beaming setting: strong beaming splits the
  // disk into hot white-gold (approaching) and deep ember (receding)
  float gT = clamp(pow(g, 0.40 + 0.20 * uBeamPow), 0.55, 1.45);
  float t = pow(clamp(RIN / r, 0.0, 1.0), 0.75) * gT;

  // --- radial structure (physically motivated) ---
  // brightness peaks at the ISCO, decays outward (Novikov-Thorne-like),
  // and fades inward through the free-fall "plunge region" toward the horizon
  float x = r / RIN;
  // Blend the two decay regimes across the ISCO (C1-continuous), so brightness
  // still peaks exactly at r = RIN but no hard ring appears there.
  float radialIn  = 1.9 * exp(-(1.0 - x) * 2.5) * smoothstep(RS, RS + 0.8, r);
  float radialOut = 1.9 * exp(-(x - 1.0) * uRadialDecay);
  float radial    = mix(radialIn, radialOut, smoothstep(0.75, 1.25, x));
  float innerAlpha = smoothstep(RS, RS + 1.2, r);   // optically thin near the horizon

  // --- turbulent, differentially-rotating dust (Interstellar-style) ---
  // Differential rotation winds any fixed pattern into threads: the
  // co-rotating angle t*Omega(r) is radius-dependent, so inner radii lap outer
  // ones and radially-extended clouds shear into thin arcs. (Advancing the
  // noise's 3rd coordinate cannot undo this — that rate is radius-dependent
  // too and just adds shear of its own.) Instead we BOUND the winding:
  // turbulence is generated in global epochs of length TGEN, chosen so even
  // the fastest radius rotates only WIND_MAX radians per epoch — not enough
  // to wind clouds into threads. Near the end of each epoch the pattern
  // crossfades into a fresh generation with a new random seed. Epoch
  // boundaries are global (radius-independent), so no radial seams appear,
  // and the disk stays cloudy indefinitely while still visibly spinning with
  // differential (Keplerian) rotation.
  float omega = sqrt(0.5 / (r * r * r));            // Keplerian angular velocity
  float spinMul = 2.0;                              // visible differential spin
  float an = atan(hit.y, hit.x);

  float WIND_MAX = 2.0;                             // max radians wound per epoch
  float OMAX = sqrt(0.5 / (RIN * RIN * RIN)) * spinMul;  // fastest angular velocity
  float TGEN = WIND_MAX / OMAX;                     // epoch length (~7.3 s)

  float ep  = floor(uSpinTime / TGEN);
  float age = uSpinTime - ep * TGEN;
  float u   = age / TGEN;

  float seedA = hash31(vec3(ep, 0.0, 0.0)) * 100.0;
  float seedB = hash31(vec3(ep + 1.0, 0.0, 0.0)) * 100.0;

  // generation A: born at the epoch start, rotated by age*omega since birth
  float arA = an - age * omega * spinMul * uSpin;
  vec2 rpA = r * vec2(cos(arA), sin(arA));
  float w1A = fbmW(vec3(rpA * 1.8, seedA + 3.1));
  float w2A = fbmW(vec3(rpA * 1.8 + vec2(5.2, 1.3), seedA + 7.7));
  float dust = fbm(vec3(rpA * 2.6 + 2.6 * vec2(w1A, w2A), seedA + 1.9));

  // crossfade into generation B over the last 35% of the epoch.
  // (u depends only on uTime, so this branch is uniform across all pixels.)
  if (u > 0.65) {
    float ageB = age - TGEN;   // B isn't born yet: negative age = pre-rotation
    float arB = an - ageB * omega * spinMul * uSpin;
    vec2 rpB = r * vec2(cos(arB), sin(arB));
    float w1B = fbmW(vec3(rpB * 1.8, seedB + 3.1));
    float w2B = fbmW(vec3(rpB * 1.8 + vec2(5.2, 1.3), seedB + 7.7));
    float dustB = fbm(vec3(rpB * 2.6 + 2.6 * vec2(w1B, w2B), seedB + 1.9));
    dust = mix(dust, dustB, smoothstep(0.65, 1.0, u));
  }

  // contrasty, filamentary dust: bright sheared threads, dark narrow lanes
  float tex = 0.18 + uTexContrast * smoothstep(0.30, 0.82, dust);

  // --- crisper outer edge: less wobble, narrower transparent fade ---
  float edge = ROUT + (dust - 0.5) * 1.6;           // ragged, rotating boundary
  float fade = 1.0 - smoothstep(edge, edge + RFADE, r);
  // patchy wisps inside the disk that solidify smoothly by the nominal outer
  // radius, so opacity never snaps at exactly r = ROUT
  float wisp = mix(smoothstep(0.15, 0.65, dust), 1.0,
                   smoothstep(ROUT - 2.5, ROUT, r));
  float alpha = clamp(fade * wisp * innerAlpha, 0.0, 1.0);

  ocol = diskColor(t) * radial * tex * beam * uDiskGain;
  oalpha = alpha;
}

// procedural sky (stars + faint nebula) sampled at the ray's escape point
vec3 sky(vec3 escPos){
  vec3 d = normalize(escPos);
  vec3 col = vec3(0.020, 0.024, 0.045);

  // faint galaxy / nebula band (direction-only: stays at infinity)
  float neb = fbm(d * 3.0 + vec3(0.0, 0.0, uTime * 0.004));
  col += vec3(0.17, 0.13, 0.26) * neb * neb;

  // Milky Way band: a great circle of denser, fainter stars and brighter
  // nebulosity, tilted well away from the disk plane so it crosses the sky
  // diagonally behind the hole (the film's backdrop structure)
  float bd = dot(d, normalize(vec3(0.28, 0.82, 0.50)));
  float band = exp(-bd * bd * 14.0);
  col += vec3(0.105, 0.098, 0.135) * band * band * (0.35 + 0.65 * neb * neb);

  // point stars on three depth layers. Stars are anchored in WORLD space on
  // spherical shells around the hole (radii 120/190/260 — well outside the
  // disk): each ray is intersected with its shell and the hash grid is
  // evaluated at that fixed world point. Because star positions don't depend
  // on the camera, orbiting and zooming only shift their apparent position
  // smoothly (true parallax — near shells slide against far ones) instead of
  // re-rolling the hash and making stars pop in/out.
  //
  // Each shell rotates rigidly at its Keplerian angular velocity
  // w = sqrt(0.5/R^3), so the inner shell drifts ~3x faster than the outer
  // ones (differential rotation). The pattern is static in the co-rotating
  // frame, so it simply spins as a rigid field — no popping — and the
  // scaling is physically motivated: anything bound this close to the hole
  // must orbit fast or it would have fallen in. (Inner shell laps in ~3 h,
  // but its ~2 deg/min drift is visible within minutes.)
  // Per-layer spawn probability scales ~1/R^2 so all shells contribute
  // roughly equal angular star density, and the sprite radius is a fixed
  // world size, so near stars look bigger and far ones shrink to pinpoints.
  vec3 dc = normalize(escPos - uEye);   // ray direction as seen from camera
  float eyeR2 = dot(uEye, uEye);
  for (int i = 0; i < 3; i++) {
    float R = 120.0 + float(i) * 70.0;            // world-space shell radius
    // ray-sphere intersection; camera (dist <= 45) is always inside, so the
    // forward hit always exists
    float b = dot(uEye, dc);
    float t = -b + sqrt(max(0.0, b * b - eyeR2 + R * R));
    vec3 gp = uEye + dc * t;                      // fixed world point on shell
    // Milky Way overdensity, evaluated BEFORE the shell rotation so the band
    // itself is static in world space while the stars drift through it
    float bdS = dot(gp / R, normalize(vec3(0.28, 0.82, 0.50)));
    float bandS = exp(-bdS * bdS * 14.0);
    // Keplerian rotation of the star field on this shell
    float w = sqrt(0.5 / (R * R * R)) * uTime;
    float cw = cos(w), sw = sin(w);
    gp = vec3(cw * gp.x + sw * gp.y, -sw * gp.x + cw * gp.y, gp.z);
    vec3 idp = floor(gp);
    vec3 fp = fract(gp) - 0.5;
    float h = hash31(idp + float(i) * 17.13);
    // equal angular density base; ~3x denser inside the Milky Way band
    float thr = 1.0 - (1100.0 / (R * R)) * (1.0 + 2.2 * bandS);
    if (h > thr) {
      float star = 1.0 - clamp(length(fp) / 0.13, 0.0, 1.0);
      float b2 = star * star;                     // tiny, sharp pinpoints
      vec3 tint = mix(vec3(0.7, 0.75, 1.0), vec3(1.0, 0.85, 0.6), hash31(idp + vec3(5, 0, 0)));
      // band crowd is fainter per-star, so it reads as a milky river of
      // resolved points rather than a brighter stripe
      float lum = (4.0 + 22.0 * hash31(idp + vec3(0, 9, 0))) * (120.0 / R)
                * (1.0 - 0.40 * bandS);
      col += tint * b2 * lum;
    }
  }
  return col;
}

vec3 tonemap(vec3 c){ return 1.0 - exp(-c * 1.35); }

void main(){
  vec2 uv = (gl_FragCoord.xy * 2.0 - uRes) / uRes.y;
  vec3 rd = normalize(uFwd + uv.x * uRight * uFov + uv.y * uUp * uFov);

  // --- orbital-plane basis: every photon stays in the plane of (eye, ray) ---
  vec3 e1 = normalize(uEye);
  vec3 n  = cross(uEye, rd);
  float nlen = length(n);
  vec3 e2;
  if (nlen > 1e-6) {
    e2 = normalize(cross(n / nlen, e1));
  } else {
    // radial ray: plane is degenerate, pick any perpendicular direction
    vec3 ref = (abs(e1.x) < 0.9) ? vec3(1.0, 0.0, 0.0) : vec3(0.0, 1.0, 0.0);
    e2 = normalize(cross(e1, ref));
  }

  // in-plane initial state; conserved E^2 = A(r0) from the null condition
  float r0 = length(uEye);
  float rdr = dot(rd, e1);
  float rdt = dot(rd, e2);
  float a0 = A(r0);
  float E2 = a0;

  float r = r0, psi = 0.0;
  float drdl = sqrt(a0) * rdr;
  float dpsidl = rdt / r0;

  vec3 prev = uEye;
  vec3 col = vec3(0.0);
  float alphaAcc = 0.0;   // accumulated disk opacity along the ray
  bool done = false;

  for(int i = 0; i < MAXSTEP; i++){
    // adaptive step: tiny near the hole (strong curvature), large in flat far field
    float h = clamp(0.02 * r, 0.015, 0.5);

    // RK2 (midpoint) on the in-plane geodesic
    vec2 a1 = accel2(r, drdl, dpsidl, E2);
    float rm      = r + drdl * h * 0.5;
    float drdlm   = drdl + a1.x * h * 0.5;
    float dpsidlm = dpsidl + a1.y * h * 0.5;
    vec2 a2 = accel2(rm, drdlm, dpsidlm, E2);
    float r2      = r + drdlm * h;
    float psi2    = psi + dpsidlm * h;
    float drdl2   = drdl + a2.x * h;
    float dpsidl2 = dpsidl + a2.y * h;

    vec3 pos = r2 * (cos(psi2) * e1 + sin(psi2) * e2);

    // disk plane crossing (z = 0); range widened to cover the wispy outer fade
    if ((prev.z > 0.0) != (pos.z > 0.0)) {
      float frac = prev.z / (prev.z - pos.z);
      vec3 hit = mix(prev, pos, clamp(frac, 0.0, 1.0));
      float hr = length(hit);
      if (hr >= RS + 0.05 && hr <= ROUT + RFADE + 2.5) {
        // reconstruct photon direction at the hit point (in-plane basis)
        float psih    = mix(psi, psi2, clamp(frac, 0.0, 1.0));
        float drdlh   = mix(drdl, drdl2, clamp(frac, 0.0, 1.0));
        float dpsidlh = mix(dpsidl, dpsidl2, clamp(frac, 0.0, 1.0));
        vec3 er   =  cos(psih) * e1 + sin(psih) * e2;
        vec3 epsi = -sin(psih) * e1 + cos(psih) * e2;
        vec3 khat = normalize(er * drdlh + epsi * (hr * dpsidlh));
        vec3 dcol; float dalpha;
        diskEmission(hit, khat, hr, dcol, dalpha);
        // front-to-back alpha compositing (semi-transparent wisps let the sky through)
        col += (1.0 - alphaAcc) * dcol * dalpha;
        alphaAcc += (1.0 - alphaAcc) * dalpha;
        if (alphaAcc > 0.985) { done = true; break; }
      }
    }

    // --- volumetric haze: visible disk thickness ---
    // A tenuous glow above/below the midplane with a noise-driven irregular
    // scale height, co-rotating with the disk, so it reads as a slightly
    // puffy slab rather than a mathematical plane. Purely emissive (adds no
    // opacity), so it never hides the lensed images behind it.
    {
      float cylR = length(pos.xy);
      // Performance: haze is a smooth, low-frequency glow, so it is sampled
      // on every OTHER integrator step at double weight (same integral), and
      // skipped entirely where its tallest possible Gaussian column is
      // already <1% — one exp instead of three noise octaves. Together these
      // remove most of the haze cost, which dominates edge-on views.
      if (cylR >= RS + 0.05 && cylR <= ROUT + 2.0
          && ((i & 1) == 0)
          && exp(-pos.z * pos.z / 0.64) > 0.010) {
        float anH = atan(pos.y, pos.x);
        float omH = sqrt(0.5 / (cylR * cylR * cylR)) * 2.0 * uSpin;
        float arH = anH - uSpinTime * omH;
        vec2 rpH = cylR * vec2(cos(arH), sin(arH));
        // structured haze: the third octave plus a height-dependent noise
        // coordinate stratify the puffs into wispy layers, so the disk's
        // thickness shows internal structure instead of reading as flat fog
        vec3 q = vec3(rpH * 0.9, pos.z * 1.6 + 41.7);
        float puff = noise3(q) * 0.55
                   + noise3(q * 2.03 + 7.3) * 0.30
                   + noise3(q * 4.10 + 3.8) * 0.15;
        float Hsc = 0.20 + 0.60 * puff;             // irregular scale height
        float vert = exp(-(pos.z * pos.z) / (Hsc * Hsc));
        float xh = cylR / RIN;
        float env = exp(-max(xh - 1.0, 0.0) * 1.1)
                  * smoothstep(RS, RS + 0.9, cylR)
                  * (1.0 - smoothstep(ROUT - 1.0, ROUT + 2.0, cylR));
        float hz = vert * env * (0.30 + 0.95 * smoothstep(0.35, 0.85, puff));
        col += (1.0 - alphaAcc) * diskColor(pow(clamp(RIN / cylR, 0.0, 1.0), 0.75)) * hz * h * (uHazeGain * 2.0);
      }
    }

    // fell through horizon
    if (r2 <= RS + 0.05) {
      done = true;
      break;
    }

    // escaped -> background, seen through any remaining transparency.
    // Short-circuit: an outward-moving photon beyond the disk's outer fade
    // is past perihelion in the weak field and can never curve back, and
    // light bending out here is negligible — so sample the sky immediately
    // instead of marching ~60 flat-space steps out to RESC. Identical
    // picture, far fewer steps per sky pixel. (The threshold matches the
    // disk-crossing test's upper bound exactly, so no legal crossing is
    // ever skipped.)
    if (r2 > RESC || (drdl2 > 0.0 && r2 > ROUT + RFADE + 2.5)) {
      col += (1.0 - alphaAcc) * sky(pos);
      done = true;
      break;
    }

    prev = pos;
    r = r2; psi = psi2; drdl = drdl2; dpsidl = dpsidl2;
  }

  // never resolved: wound around photon sphere -> boosted warm photon ring
  if (!done) col += (1.0 - alphaAcc) * vec3(0.28, 0.15, 0.055);

  gl_FragColor = vec4(tonemap(col), 1.0);
}
</script>

<script id="fsBlur" type="x-shader/x-fragment">
precision mediump float;
uniform sampler2D uTex;
uniform vec2  uDir;   // (1/res.x, 1/res.y) scaled
uniform float uThresh;      // bright-pass threshold; 0.0 = plain blur
varying vec2 vUv;

// sample the texture, optionally high-passing above uThresh. At 0.0 this is
// identity (a plain 5-tap tap); otherwise only the luminous pixels feed the
// blur, so the glow reads as the bright disk + lensed stars, not a wash.
vec3 thr(vec2 uv){
  vec3 c = texture2D(uTex, uv).rgb;
  if (uThresh > 0.0){
    float m = max(max(c.r, c.g), c.b);
    c *= smoothstep(uThresh, uThresh + 0.2, m);
     }
  return c;
}

void main(){
  vec2 off = uDir;
  vec3 c = thr(vUv) * 0.227027;
  c += thr(vUv + off * 1.3836) * 0.316216;
  c += thr(vUv - off * 1.3836) * 0.316216;
  c += thr(vUv + off * 3.2304) * 0.070270;
  c += thr(vUv - off * 3.2304) * 0.070270;
  gl_FragColor = vec4(c, 1.0);
}
</script>

<script id="fsComposite" type="x-shader/x-fragment">
precision mediump float;
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform sampler2D uBloomWide;
uniform sampler2D uFlare;
uniform float uStrength;        // narrow   (half-res)   bloom weight
uniform float uStrengthWide;    // wide     (quarter-res) bloom weight
uniform float uStrengthFlare;   // anamorphic horizontal streak weight
uniform vec2  uRes;
uniform float uTime;
varying vec2 vUv;

float hash21(vec2 p){
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

void main(){
  vec3 s     = texture2D(uScene, vUv).rgb;
  vec3 b     = texture2D(uBloom, vUv).rgb;
  vec3 bw    = texture2D(uBloomWide, vUv).rgb;
  vec3 fl    = texture2D(uFlare, vUv).rgb;
  vec3 c = s + b * uStrength + bw * uStrengthWide + fl * uStrengthFlare;

  // --- lens ghosts: faint internal-reflection circles along the flare axis ---
  // real anamorphic lenses bounce light between elements, producing dim,
  // displaced ghost images of the bright source. Sampled from the same
  // bright-pass, mirrored through the frame centre at two scales and masked
  // to rings so they read as optics, not blobs.
  vec2 ctr = vUv - 0.5;
  vec2 gc1 = -ctr * 0.55 + 0.5;      // small ghost, opposite the source
  vec2 gc2 = -ctr * 1.45 + 0.5;      // larger ghost, pushed past centre
  float r1 = length(gc1 - 0.5) * 2.0;
  float r2 = length(gc2 - 0.5) * 2.0;
  float m1 = smoothstep(0.05, 0.35, r1) * (1.0 - smoothstep(0.75, 1.05, r1));
  float m2 = smoothstep(0.05, 0.35, r2) * (1.0 - smoothstep(0.75, 1.05, r2));
  c += texture2D(uFlare, gc1).rgb * vec3(1.00, 0.85, 0.62) * m1 * 0.16
     + texture2D(uFlare, gc2).rgb * vec3(0.58, 0.66, 0.95) * m2 * 0.13;

  // --- cinematic grade ---
  // gentle shadow desaturation (film stocks lose chroma in the darks)
  float lum = dot(c, vec3(0.299, 0.587, 0.114));
  c = mix(vec3(lum), c, mix(0.82, 1.0, smoothstep(0.0, 0.35, lum)));
  // vignette
  vec2 vq = (vUv - 0.5) * vec2(uRes.x / uRes.y, 1.0);
  float vig = smoothstep(1.35, 0.45, length(vq));
  c *= mix(0.72, 1.0, vig);
  // animated film grain (strongest in the shadows, ~invisible in highlights)
  float gr = hash21(gl_FragCoord.xy + vec2(fract(uTime * 13.7) * 61.0, fract(uTime * 7.3) * 47.0));
  c += (gr - 0.5) * 0.045 * (1.0 - clamp(lum, 0.0, 1.0));

  gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
}
</script>

<script>
(function () {
  const errBox = document.getElementById('err');
  function fail(msg) {
    errBox.style.display = 'block';
    errBox.textContent = 'WebGL error:\n\n' + msg;
    throw new Error(msg);
  }
  try {
  const canvas = document.getElementById('gl');
  const gl = canvas.getContext('webgl', { antialias: false, preserveDrawingBuffer: false })
          || canvas.getContext('experimental-webgl', { antialias: false });
  if (!gl) { fail('WebGL context could not be created. Your browser/GPU may not support WebGL.'); return; }

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(sh));
    }
    return sh;
  }
  function program(vsSrc, fsSrc) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(p));
    }
    return p;
  }

  const vsQuad = document.getElementById('vsQuad').textContent;
  const progScene = program(vsQuad, document.getElementById('fsScene').textContent);
  const progBlur  = program(vsQuad, document.getElementById('fsBlur').textContent);
  const progComp  = program(vsQuad, document.getElementById('fsComposite').textContent);

  // fullscreen triangle
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);

  function quad(p) {
    const loc = gl.getAttribLocation(p, 'aPos');
    gl.enableVertexAttribArray(loc);
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function makeTarget(w, h) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex, fbo, w, h };
  }

   // Coarse pointer (touch screen): only affects the pinch/scroll HUD hint.
  const coarse = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches)
                 || (navigator.maxTouchPointers || 0) > 0;
  let sceneT = null, blurA = null, blurB = null, qA = null, qB = null,
      fA = null, fB = null,
      W = 0, H = 0, SW = 0, SH = 0, BW = 0, BH = 0, QW = 0, QH = 0;

  // --- adaptive render quality -------------------------------------------
  // The canvas backing store stays at full (capped-DPR) resolution; only the
  // internal scene/bloom targets scale. `quality` multiplies that base res:
  // a controller aiming for 60 fps steps it down quickly when frames run
  // long and back up slowly (only after sustained headroom), with a cooldown
  // between changes so it can't oscillate. The composite pass upscales the
  // scene target with linear filtering.
  const DPR_CAP = 2.0;
  const Q_MIN = 0.45, Q_MAX = 1.0;
  let quality = 1.0;

  function rebuildTargets() {
    SW = Math.max(2, Math.floor(W * quality));
    SH = Math.max(2, Math.floor(H * quality));
    BW = Math.max(2, SW >> 1);
    BH = Math.max(2, SH >> 1);
    QW = Math.max(2, BW >> 1);
    QH = Math.max(2, BH >> 1);
    sceneT = makeTarget(SW, SH);
    blurA = makeTarget(BW, BH);
    blurB = makeTarget(BW, BH);
    qA = makeTarget(QW, QH);
    qB = makeTarget(QW, QH);
    fA = makeTarget(QW, QH);
    fB = makeTarget(QW, QH);
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    W = canvas.width  = Math.max(2, Math.floor(canvas.clientWidth  * dpr));
    H = canvas.height = Math.max(2, Math.floor(canvas.clientHeight * dpr));
    rebuildTargets();
  }
  window.addEventListener('resize', resize);
  resize();

  // camera
  let yaw = 0.7, pitch = 0.04, dist = 13.0;
  const spin = 1.0;
  const FOV = Math.tan(1.05 / 2);

  function cameraVectors() {
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    const cy = Math.cos(yaw), sy = Math.sin(yaw);
    const eye = [
      dist * cp * cy,
      dist * cp * sy,
      dist * sp
    ];
    // lookAt basis: camera at `eye` looking at origin, world-up = +Z
    const fwd = [-cp * cy, -cp * sy, -sp];       // toward target (origin)
    const right = [-sy, cy, 0];                  // normalize(cross(worldUp, -fwd))
    const up = [-sp * cy, -sp * sy, cp];         // cross(-fwd, right)
    return { eye, fwd, right, up };
  }

   // Interaction: one finger / mouse orbits, two fingers pinch-zoom.
   // Pointers are tracked by id so a multi-touch gesture reads like an image
   // viewer, not a page scroll (which needs touch-action:none on the canvas).
   // setPointerCapture is best-effort: a handful of mobile browsers throw on it.
  const pointers = new Map();     // pointerId -> {x, y} current position
  let dragging = false;
  let pinchLast = 0;             // last two-finger distance; 0 while no pinch
  function setDist(v){ dist = Math.max(3.5, Math.min(45.0, v)); }

  canvas.addEventListener('pointerdown', e => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const a = [...pointers.values()];
    pinchLast = (a.length >= 2)
        ? Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) : 0;
    dragging = pointers.size > 0;
    try { canvas.setPointerCapture(e.pointerId); } catch (_e) {}
    });
  canvas.addEventListener('pointermove', e => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    if (pointers.size === 1) {
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;
      yaw      -= dx * 0.005;
      pitch    += dy * 0.005;   // vertical drag direction flipped
      pitch = Math.max(-1.45, Math.min(1.45, pitch));
      } else {
        // two or more fingers: pinch to zoom (spreading apart = zoom in)
      p.x = e.clientX; p.y = e.clientY;
      const a = [...pointers.values()];
      const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
      if (pinchLast > 0.0) setDist(dist * (pinchLast / d));
      pinchLast = d;
      }
    });
  function endPointer(e){
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchLast = 0;
    dragging = pointers.size > 0;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_e) {}
    }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    dist *= Math.exp(e.deltaY * 0.0012);
    dist = Math.max(3.5, Math.min(45.0, dist));
  }, { passive: false });
  canvas.addEventListener('dblclick', () => { yaw = 0.7; pitch = 0.04; dist = 13.0; });

  const start = performance.now();
  let lastT = start, fpsAcc = 0, fpsN = 0, fpsShown = 0;
  const hudText = document.getElementById('hudText');
  const fpsTgtEl = document.getElementById('fpsTgt');

  // --- adaptive quality controller (targets fpsTarget) ---
  let fpsTarget = 30;
  let qCooldown = 0;      // seconds until the next quality change is allowed
  let qGoodTime = 0;      // seconds of sustained headroom (for stepping UP)

  // -5 / +5 buttons next to the HUD: adjust the fps target (10..120).
  // Reset the controller timers so it reacts immediately to the new target.
  function bumpTarget(d) {
    fpsTarget = Math.max(10, Math.min(120, fpsTarget + d));
    fpsTgtEl.textContent = fpsTarget;
    qCooldown = 0; qGoodTime = 0;
  }
  document.getElementById('fpsDown').addEventListener('click', () => bumpTarget(-5));
  document.getElementById('fpsUp').addEventListener('click', () => bumpTarget(5));

  // ---------- look-tuning panel ----------
  // Real-time sliders for the key art-direction knobs. Each maps 1:1 onto a
  // shader uniform (or a post weight), so dragging updates the very next
  // frame with no shader recompiles. Settings persist in localStorage.
  const SLIDERS = [
    { id: 'diskGain',    label: 'brightness', min: 0.5, max: 5.0,  step: 0.05,  def: 2.4 },
    { id: 'beamPow',     label: 'doppler',    min: 0.0, max: 4.0,  step: 0.05,  def: 0.65 },
    { id: 'radialDecay', label: 'falloff',    min: 0.3, max: 3.0,  step: 0.05,  def: 1.25 },
    { id: 'texContrast', label: 'texture',    min: 0.0, max: 3.0,  step: 0.05,  def: 1.65 },
    { id: 'hazeGain',    label: 'haze',       min: 0.0, max: 0.4,  step: 0.005, def: 0.12 },
    { id: 'bloomScale',  label: 'bloom',      min: 0.0, max: 2.5,  step: 0.05,  def: 1.0 },
    { id: 'flareGain',   label: 'flare',      min: 0.0, max: 1.0,  step: 0.01,  def: 0.24 },
    { id: 'spinRate',    label: 'spin',       min: 0.0, max: 3.0,  step: 0.05,  def: 1.0 },
  ];
  const vals = {};
  SLIDERS.forEach(s => { vals[s.id] = s.def; });

  let spinTime = 0;   // disk pattern clock, advanced by dt * spinRate.
                      // Scaling the CLOCK (not TGEN) means epoch boundaries
                      // stay continuous: changing speed never pops the pattern.

  const TUNE_KEY = 'bh.tune.v1';
  try {
    const saved = JSON.parse(localStorage.getItem(TUNE_KEY) || '{}');
    SLIDERS.forEach(s => {
      if (typeof saved[s.id] === 'number' && saved[s.id] >= s.min && saved[s.id] <= s.max) {
        vals[s.id] = saved[s.id];
      }
    });
  } catch (_e) { /* storage unavailable (private mode) — defaults are fine */ }

  let saveTimer = null;
  function saveTune() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(TUNE_KEY, JSON.stringify(vals)); } catch (_e) {}
    }, 250);
  }

  const tuneEl = document.getElementById('tune');
  const decimals = s => Math.max(0, -Math.floor(Math.log10(s.step)));
  tuneEl.innerHTML =
    '<div id="tuneHead"><b>TUNE</b><span>' +
    '<button id="tuneReset" title="Restore defaults">reset</button>' +
    '<button id="tuneHide" title="Collapse panel">&ndash;</button></span></div>' +
    '<div id="tuneRows">' +
    SLIDERS.map(s =>
      '<div class="trow"><label>' + s.label +
      '<span class="val" id="val_' + s.id + '"></span></label>' +
      '<input type="range" id="sl_' + s.id + '" min="' + s.min + '" max="' + s.max +
      '" step="' + s.step + '"></div>'
    ).join('') + '</div>';

  function refreshTuneUI() {
    SLIDERS.forEach(s => {
      document.getElementById('sl_' + s.id).value = vals[s.id];
      document.getElementById('val_' + s.id).textContent = vals[s.id].toFixed(decimals(s));
    });
  }
  SLIDERS.forEach(s => {
    document.getElementById('sl_' + s.id).addEventListener('input', e => {
      vals[s.id] = parseFloat(e.target.value);
      document.getElementById('val_' + s.id).textContent = vals[s.id].toFixed(decimals(s));
      saveTune();
    });
  });
  document.getElementById('tuneReset').addEventListener('click', () => {
    SLIDERS.forEach(s => { vals[s.id] = s.def; });
    refreshTuneUI();
    saveTune();
  });
  const tuneRows = document.getElementById('tuneRows');
  function setTuneHidden(h) {
    tuneRows.style.display = h ? 'none' : '';
    document.getElementById('tuneHide').innerHTML = h ? '+' : '&ndash;';
  }
  document.getElementById('tuneHide').addEventListener('click', () => {
    setTuneHidden(tuneRows.style.display !== 'none');
  });
  refreshTuneUI();
  setTuneHidden(coarse);   // start collapsed on touch devices to keep the view clean

  function adaptQuality(dt, fps) {
    qCooldown = Math.max(0, qCooldown - dt);
    if (qCooldown > 0) return;

    if (fps < fpsTarget - 4) {
      // running slow: step down fast (proportional to the shortfall)
      const step = fps < fpsTarget * 0.6 ? 0.20 : 0.10;
      quality = Math.max(Q_MIN, quality - step);
      rebuildTargets();
      qCooldown = 1.0; qGoodTime = 0;
    } else if (fps > fpsTarget + 2 && quality < Q_MAX) {
      // sustained headroom: step back up slowly, one notch at a time
      qGoodTime += dt;
      if (qGoodTime >= 2.0) {
        quality = Math.min(Q_MAX, quality + 0.08);
        rebuildTargets();
        qCooldown = 1.5; qGoodTime = 0;
      }
    } else {
      qGoodTime = 0;
    }
  }

  function render(now) {
    const time = (now - start) / 1000;
    const dt = Math.min((now - lastT) / 1000, 0.1);
    lastT = now;
    if (!dragging) yaw += 0.03 * dt; // gentle auto-orbit (time-based)
    spinTime += dt * vals.spinRate;  // tunable disk-pattern clock

    // fps readout + adaptive quality (updated ~2x/sec)
    fpsAcc += dt; fpsN++;
    if (fpsAcc >= 0.5) {
      fpsShown = Math.round(fpsN / fpsAcc);
      adaptQuality(fpsAcc, fpsShown);
      fpsAcc = 0; fpsN = 0;
      hudText.innerHTML = '<b>drag</b> orbit · ' + (coarse ? '<b>pinch</b>' : '<b>scroll</b>') + ' zoom · <b>dbl-click</b> reset<br>'
                    + fpsShown + ' fps · ' + SW + '×' + SH + ' render · q ' + Math.round(quality * 100) + '%';
    }

    const cam = cameraVectors();

    // ---- scene pass (internal resolution) ----
    gl.bindFramebuffer(gl.FRAMEBUFFER, sceneT.fbo);
    gl.viewport(0, 0, SW, SH);
    gl.useProgram(progScene);
    gl.uniform2f(gl.getUniformLocation(progScene, 'uRes'), SW, SH);
    gl.uniform1f(gl.getUniformLocation(progScene, 'uTime'), time);
    gl.uniform3fv(gl.getUniformLocation(progScene, 'uEye'), cam.eye);
    gl.uniform3fv(gl.getUniformLocation(progScene, 'uFwd'), cam.fwd);
    gl.uniform3fv(gl.getUniformLocation(progScene, 'uRight'), cam.right);
    gl.uniform3fv(gl.getUniformLocation(progScene, 'uUp'), cam.up);
    gl.uniform1f(gl.getUniformLocation(progScene, 'uFov'), FOV);
    gl.uniform1f(gl.getUniformLocation(progScene, 'uSpin'), spin);
    gl.uniform1f(gl.getUniformLocation(progScene, 'uSpinTime'), spinTime);
    gl.uniform1f(gl.getUniformLocation(progScene, 'uDiskGain'), vals.diskGain);
    gl.uniform1f(gl.getUniformLocation(progScene, 'uBeamPow'), vals.beamPow);
    gl.uniform1f(gl.getUniformLocation(progScene, 'uRadialDecay'), vals.radialDecay);
    gl.uniform1f(gl.getUniformLocation(progScene, 'uTexContrast'), vals.texContrast);
    gl.uniform1f(gl.getUniformLocation(progScene, 'uHazeGain'), vals.hazeGain);
    quad(progScene);

    // ---- bloom at half internal res: horizontal then vertical blur ----
    gl.useProgram(progBlur);
    const uTex = gl.getUniformLocation(progBlur, 'uTex');
    const uDir = gl.getUniformLocation(progBlur, 'uDir');
    const uThresh = gl.getUniformLocation(progBlur, 'uThresh');

    gl.bindFramebuffer(gl.FRAMEBUFFER, blurA.fbo);
    gl.viewport(0, 0, BW, BH);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneT.tex);
    gl.uniform1i(uTex, 0);
    gl.uniform1f(uThresh, 0.82);
    gl.uniform2f(uDir, 1.0 / BW, 0.0);
    quad(progBlur);

    gl.uniform1f(uThresh, 0.0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, blurB.fbo);
    gl.bindTexture(gl.TEXTURE_2D, blurA.tex);
    gl.uniform2f(uDir, 0.0, 1.0 / BH);
    quad(progBlur);

      // octave 2: downsample the half-res bloom to quarter res for a wide, soft halo
    gl.bindFramebuffer(gl.FRAMEBUFFER, qA.fbo);
    gl.viewport(0, 0, QW, QH);
    gl.bindTexture(gl.TEXTURE_2D, blurB.tex);
    gl.uniform1f(uThresh, 0.0);
    gl.uniform2f(uDir, 1.0 / QW, 0.0);
    quad(progBlur);

    gl.bindFramebuffer(gl.FRAMEBUFFER, qB.fbo);
    gl.bindTexture(gl.TEXTURE_2D, qA.tex);
    gl.uniform1f(uThresh, 0.0);
    gl.uniform2f(uDir, 0.0, 1.0 / QH);
    quad(progBlur);

    // ---- anamorphic flare: bright-pass, then smear horizontally only ----
    // two passes with growing reach give a subtle 65mm-lens streak across
    // the brightest highlights (no vertical component)
    gl.bindFramebuffer(gl.FRAMEBUFFER, fA.fbo);
    gl.viewport(0, 0, QW, QH);
    gl.bindTexture(gl.TEXTURE_2D, sceneT.tex);
    gl.uniform1f(uThresh, 0.88);
    gl.uniform2f(uDir, 2.0 / QW, 0.0);
    quad(progBlur);

    gl.uniform1f(uThresh, 0.0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fB.fbo);
    gl.bindTexture(gl.TEXTURE_2D, fA.tex);
    gl.uniform2f(uDir, 9.0 / QW, 0.0);
    quad(progBlur);

    // ---- composite to screen (upscale) ----
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    gl.useProgram(progComp);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneT.tex);
    gl.uniform1i(gl.getUniformLocation(progComp, 'uScene'), 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, blurB.tex);
    gl.uniform1i(gl.getUniformLocation(progComp, 'uBloom'), 1);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, qB.tex);
    gl.uniform1i(gl.getUniformLocation(progComp, 'uBloomWide'), 2);
    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, fB.tex);
    gl.uniform1i(gl.getUniformLocation(progComp, 'uFlare'), 3);
    gl.uniform1f(gl.getUniformLocation(progComp, 'uStrength'), 0.28 * vals.bloomScale);
    gl.uniform1f(gl.getUniformLocation(progComp, 'uStrengthWide'), 0.38 * vals.bloomScale);
    gl.uniform1f(gl.getUniformLocation(progComp, 'uStrengthFlare'), vals.flareGain);
    gl.uniform2f(gl.getUniformLocation(progComp, 'uRes'), W, H);
    gl.uniform1f(gl.getUniformLocation(progComp, 'uTime'), time);
    quad(progComp);

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
  } catch (e) {
    fail(e && e.message ? e.message : String(e));
  }
})();
